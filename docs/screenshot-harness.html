<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Civicomfy — screenshot harness</title>
  <link rel="stylesheet" href="../web/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../web/js/civitaiDownloader.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #211f1e; display: flex; align-items: center; justify-content: center; }
    body.cfy-theme-light { background: #d9d5c9; }
    .civitai-downloader-modal { position: static !important; background: none !important; backdrop-filter: none !important; opacity: 1 !important; visibility: visible !important; }
    * { transition: none !important; animation: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
  </style>
</head>
<body>
<script type="module">
import { modalTemplate, PAGE_META } from '../web/js/ui/templates.js';
import { renderDownloadList } from '../web/js/ui/statusRenderer.js';

// ---- synthetic thumbnails (warm gradients, clearly illustrative) ----
function thumb(i, w = 240, h = 320) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const hues = [18, 32, 6, 44, 200, 268, 150, 96];
  const hue = hues[i % hues.length];
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, `hsl(${hue} 42% 46%)`);
  grad.addColorStop(1, `hsl(${(hue + 40) % 360} 30% 22%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.globalAlpha = 0.16; g.fillStyle = '#fff';
  for (let k = 0; k < 5; k++) g.beginPath(), g.arc(w * (0.2 + 0.16 * k), h * (0.3 + 0.1 * (k % 3)), w * 0.16, 0, 7), g.fill();
  g.globalAlpha = 1;
  return c.toDataURL('image/png');
}

const params = new URLSearchParams(location.hash.slice(1));
const tab = params.get('tab') || 'download';
if (params.get('theme') === 'light') document.body.classList.add('cfy-theme-light');

const modal = document.createElement('div');
modal.className = 'civitai-downloader-modal open';
modal.innerHTML = modalTemplate({ numConnections: 1, autoOpenStatusTab: true, hideMatureInSearch: true, deepSubfolderCheck: true });
document.body.appendChild(modal);
const content = modal.querySelector('.civitai-downloader-modal-content');
if (params.get('collapsed') === '1') content.classList.add('rail-collapsed');

const q = (s) => modal.querySelector(s);
const types = ['checkpoints', 'loras', 'vae', 'controlnet', 'embeddings', 'upscale_models', 'diffusion_models'];
for (const id of ['civitai-model-type', 'civitai-settings-default-type', 'civitai-mymodels-type-filter', 'civitai-browse-type-select']) {
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; q('#' + id).appendChild(o); });
}
q('#civitai-model-type').value = 'loras';
q('#civitai-subdir-select').insertAdjacentHTML('beforeend', '<option value="style" selected>style</option>');
['SD 1.5', 'SDXL 1.0', 'Pony', 'Flux.1 D', 'Illustrious'].forEach(n => {
  q('#civitai-browse-base-model-options').insertAdjacentHTML('beforeend',
    `<label class="civitai-base-model-option"><input type="checkbox" class="civitai-base-model-checkbox"> ${n}</label>`);
});

// ---- Download tab ----
q('#civitai-model-url').value = 'https://civitai.com/models/000000?modelVersionId=000000';
q('#civitai-download-preview-area').innerHTML = `
  <div class="cfy-preview-card">
    <div class="cfy-prev-gallery">
      <div class="cfy-prev-gallery-main"><img src="${thumb(1, 300, 450)}"></div>
      <div class="cfy-prev-thumbstrip">
        ${[2, 3, 4, 5].map(i => `<div class="cfy-prev-gallery-thumb${i === 2 ? ' active' : ''}"><img src="${thumb(i, 96, 96)}"></div>`).join('')}
      </div>
    </div>
    <div class="cfy-prev-info">
      <div class="cfy-prev-header">
        <span class="cfy-prev-type-badge">LORA</span>
        <h4 class="cfy-prev-title">Example Watercolour Style</h4>
        <div class="cfy-prev-meta">
          <span><i class="fas fa-user"></i> example_creator</span>
          <span class="cfy-prev-base-badge">SDXL 1.0</span>
          <span><i class="fas fa-code-branch"></i> v2.0</span>
        </div>
      </div>
      <div class="cfy-prev-stats">
        <span class="cfy-prev-stat"><i class="fas fa-download"></i> 12,480</span>
        <span class="cfy-prev-stat"><i class="fas fa-heart"></i> 1,204</span>
        <span class="cfy-prev-stat"><i class="fas fa-hdd"></i> 144.2 MB</span>
      </div>
      <div class="cfy-prev-box cfy-prev-box--muted">
        <div class="cfy-prev-box-header">
          <span class="cfy-prev-section-label"><i class="fas fa-file-signature"></i> Saving as</span>
          <button class="cfy-copy-btn"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <div class="cfy-prev-file-name">models/loras/style/example_watercolour_style_v2.safetensors</div>
      </div>
      <div class="cfy-prev-box cfy-prev-box--amber">
        <div class="cfy-prev-box-header">
          <span class="cfy-prev-section-label"><i class="fas fa-bolt"></i> Trigger words</span>
          <button class="cfy-copy-btn"><i class="fas fa-copy"></i> Copy all</button>
        </div>
        <div class="cfy-prev-words">
          <span class="cfy-prev-trained-word">watercolour style</span>
          <span class="cfy-prev-trained-word">soft wash</span>
          <span class="cfy-prev-trained-word">paper texture</span>
        </div>
      </div>
    </div>
  </div>`;

// ---- Browse tab ----
q('#civitai-browse-search').value = 'watercolour';
const bcards = q('#civitai-browse-results');
const chip = (label, hue) => `<span class="civitai-browse-card-type-chip" style="background:hsl(${hue} 30% 40% / 0.22);border-color:hsl(${hue} 30% 55% / 0.5);color:hsl(${hue} 40% 68%);">${label}</span>`;
const names = ['Example Watercolour Style', 'Sample Line Art', 'Demo Cinematic Light', 'Placeholder Ink Wash',
  'Example Soft Portrait', 'Sample Retro Film', 'Demo Studio Product', 'Placeholder Pastel Set',
  'Example Neon City', 'Sample Clay Render', 'Demo Paper Cut', 'Placeholder Gouache'];
names.forEach((n, i) => {
  bcards.insertAdjacentHTML('beforeend', `
    <div class="civitai-browse-card">
      <div class="civitai-browse-card-preview">
        <img src="${thumb(i)}">
        <span class="civitai-browse-card-badge">v${1 + (i % 3)}.0</span>
        <span class="civitai-browse-card-bm-badge">${i % 2 ? 'SDXL 1.0' : 'Flux.1 D'}</span>
        ${i === 3 ? '<div class="civitai-browse-card-installed-overlay"><span class="civitai-browse-card-installed-badge"><i class="fas fa-check"></i> Installed</span></div>' : ''}
      </div>
      <div class="civitai-browse-card-body">
        <div class="civitai-browse-card-name-row">
          <span class="civitai-browse-card-name">${n}</span>
          <button class="civitai-browse-card-info-btn"><i class="fas fa-info"></i></button>
        </div>
        <div class="civitai-browse-card-type-row">
          ${i % 3 === 0 ? chip('LORA', 268) : i % 3 === 1 ? chip('CHECKPOINT', 210) : chip('EMBEDDING', 32)}
          <span class="civitai-browse-card-bm-chip">${i % 2 ? 'SDXL 1.0' : 'Flux.1 D'}</span>
        </div>
        <div class="civitai-browse-card-meta">
          <span class="civitai-browse-card-meta-line"><i class="fas fa-user"></i> example_creator</span>
          <span class="civitai-browse-card-meta-line"><i class="fas fa-download"></i> ${(3 + i) * 1310}</span>
        </div>
      </div>
    </div>`);
});
q('#civitai-browse-pagination').innerHTML =
  `<button class="civitai-button small">&laquo; Prev</button>
   <button class="civitai-button small primary active">1</button>
   <button class="civitai-button small">2</button>
   <button class="civitai-button small">3</button>
   <button class="civitai-button small">Next &raquo;</button>
   <div class="civitai-pagination-info">Page 1 of 3 (illustrative data)</div>`;

// ---- My Models tab ----
const mm = q('#civitai-mymodels-list');
mm.innerHTML = '';
const files = ['example_watercolour_v2.safetensors', 'sample_line_art.safetensors', 'demo_cinematic.safetensors',
  'placeholder_ink.safetensors', 'example_portrait.safetensors', 'sample_retro_film.safetensors',
  'demo_product.safetensors', 'placeholder_pastel.safetensors', 'example_neon.safetensors',
  'sample_clay.safetensors', 'demo_papercut.safetensors', 'placeholder_gouache.safetensors'];
files.forEach((f, i) => {
  mm.insertAdjacentHTML('beforeend', `
    <div class="civitai-mymodel-card">
      <div class="civitai-mymodel-card-preview">
        <img src="${thumb(i + 2)}">
        <span class="civitai-mymodel-card-badge">${i % 3 ? 'LORA' : 'CKPT'}</span>
        <span class="civitai-mymodel-card-bm-badge">SDXL 1.0</span>
      </div>
      <div class="civitai-mymodel-card-body">
        <div class="civitai-mymodel-name">${f}</div>
        <div class="civitai-mymodel-meta">
          <span class="civitai-mymodel-meta-line"><i class="fas fa-hdd"></i> ${120 + i * 17} MB</span>
          <span class="civitai-mymodel-meta-line"><i class="fas fa-clock"></i> Jul ${2 + i}, 2026</span>
        </div>
      </div>
    </div>`);
});
q('#civitai-mymodels-count').textContent = '12 of 340 models';
q('#civitai-mymodels-search').value = '';

// ---- Gallery tab ----
const grid = q('#civitai-gallery-grid');
for (let i = 0; i < 18; i++) {
  grid.insertAdjacentHTML('beforeend', `
    <div class="civitai-gallery-card${i === 1 || i === 4 ? ' selected' : ''}">
      <div class="civitai-gallery-card-preview">
        <img src="${thumb(i + 4)}">
        <span class="civitai-gallery-card-date-badge">Jul ${10 + (i % 14)}</span>
        <div class="civitai-gallery-card-select-wrap"><div class="civitai-gallery-card-checkbox">${i === 1 || i === 4 ? '<i class="fas fa-check"></i>' : ''}</div></div>
      </div>
      <div class="civitai-gallery-card-body">
        <div class="civitai-gallery-card-name">ComfyUI_0${1000 + i}_.png</div>
        <div class="civitai-gallery-card-meta"><span><i class="fas fa-folder"></i> renders</span></div>
      </div>
    </div>`);
}
q('#civitai-gallery-count').textContent = '18 of 1,204 images';
q('#civitai-gallery-select-bar').style.display = 'flex';
q('#civitai-gallery-select-count').textContent = '2 selected';

// ---- Status tab (rendered by the real statusRenderer) ----
const fmtBytes = (b) => {
  if (!b) return '0 Bytes';
  const u = ['Bytes','KB','MB','GB','TB']; const i = Math.min(u.length - 1, Math.floor(Math.log(Math.abs(b)) / Math.log(1024)));
  return parseFloat((b / Math.pow(1024, i)).toFixed(2)) + ' ' + u[i];
};
const uiShim = {
  settings: { hideMatureInSearch: true, nsfwBlurMinLevel: 4 },
  formatBytes: fmtBytes,
  formatSpeed: (s) => (s > 0 ? fmtBytes(s) + '/s' : ''),
  formatDuration: () => '1m 12s',
  ensureFontAwesome: () => {},
};
const dl = (over) => Object.assign({
  id: 'x', model_name: 'Example Watercolour Style', version_name: 'v2.0',
  filename: 'example_watercolour_v2.safetensors', output_dir: 'models/loras/style',
  known_size: 151000000, file_format: 'SafeTensor', file_precision: 'fp16', file_model_size: 'full',
  thumbnail: thumb(1, 160, 220), thumbnail_nsfw_level: 1, connection_type: '1',
}, over);
renderDownloadList(uiShim, [
  dl({ status: 'downloading', progress: 68, speed: 14.2 * 1024 * 1024 }),
  dl({ status: 'downloading', progress: 23, speed: 9.8 * 1024 * 1024, model_name: 'Demo Cinematic Light', version_name: 'v1.0', filename: 'demo_cinematic.safetensors', output_dir: 'models/loras', thumbnail: thumb(4, 160, 220) }),
], q('#civitai-active-list'), 'No active downloads.');
renderDownloadList(uiShim, [
  dl({ status: 'queued', progress: 0, model_name: 'Sample Line Art', version_name: 'v3.1', filename: 'sample_line_art.safetensors', output_dir: 'models/loras/lineart', thumbnail: thumb(6, 160, 220) }),
], q('#civitai-queued-list'), 'Download queue is empty.');
renderDownloadList(uiShim, [
  dl({ status: 'completed', progress: 100, model_name: 'Placeholder Ink Wash', version_name: 'v1.2', filename: 'placeholder_ink.safetensors', output_dir: 'models/loras', thumbnail: thumb(3, 160, 220), start_time: '2026-07-25T09:00:00Z', end_time: '2026-07-25T09:01:12Z' }),
  dl({ status: 'failed', progress: 42, model_name: 'Example Neon City', version_name: 'v1.0', filename: 'example_neon.safetensors', output_dir: 'models/loras', thumbnail: thumb(8, 160, 220), error: 'HTTP 401 — the Civitai API key is missing or expired.' }),
], q('#civitai-history-list'), 'No download history yet.');

// ---- Settings tab ----
q('#civitai-settings-nsfw-threshold').value = '4';
q('#civitai-settings-default-type').value = 'loras';
q('#civitai-settings-api-key').value = '••••••••••••••••••••••••';
q('#civitai-settings-hf-token').value = '••••••••••••••••••';
types.forEach(t => q('#civitai-maintenance-type-picker').insertAdjacentHTML('beforeend',
  `<label class="civitai-maintenance-type-opt"><input type="checkbox" class="civitai-checkbox"><span>${t}</span></label>`));

// ---- Directories tab ----
q('#civitai-dir-settings-list').innerHTML = types.map((t, i) => `
  <div class="civitai-dir-row">
    <label class="civitai-dir-row-label">${t}</label>
    <input class="civitai-input civitai-dir-row-input" value="${i === 1 ? 'D:/shared/models/loras' : ''}" placeholder="E:/ComfyUI/models/${t}">
    <button class="civitai-button small secondary civitai-dir-row-reset"><i class="fas fa-rotate-left"></i></button>
  </div>`).join('');

// ---- activity badge + active section ----
q('#civitai-status-indicator').style.display = 'inline-flex';
q('#civitai-active-count').textContent = '3';

modal.querySelectorAll('.civitai-downloader-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
modal.querySelectorAll('.civitai-downloader-tab-content').forEach(c => c.classList.toggle('active', c.id === 'civitai-tab-' + tab));
q('#civitai-page-title').textContent = PAGE_META[tab].title;
q('#civitai-page-sub').textContent = PAGE_META[tab].sub;

const scrollBy = parseInt(params.get('scroll') || '0', 10);
if (scrollBy) q('#civitai-tab-' + tab).scrollTop = scrollBy;

// wait for fonts + images before signalling readiness
Promise.all([document.fonts.ready, ...[...modal.querySelectorAll('img')].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))])
  .then(() => { document.title = 'ready'; window.__ready = true; });
</script>
</body>
</html>
