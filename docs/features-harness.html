<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civicomfy — features harness</title>
  <!-- The monitor and autocomplete import ComfyUI's api.js; serve a stub instead. -->
  <script type="importmap">{ "imports": { "/scripts/api.js": "/docs/harness-api-stub.js" } }</script>
  <link rel="stylesheet" href="../web/js/civitaiDownloader.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #1c1c1e; font-family: "Segoe UI", sans-serif; color: #ddd; }
    html.cfy-still *, html.cfy-still *::before, html.cfy-still *::after { transition: none !important; animation: none !important; }
    .bar { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: #141415; border-bottom: 1px solid #2a2a2c; }
    .bar .group { display: flex; align-items: center; gap: 8px; }
    .bar .queue { margin-left: auto; padding: 6px 16px; border-radius: 6px; background: #3b6fd8; color: #fff; font-size: 13px; }
    .node { position: absolute; left: 32px; top: 32px; width: 460px; background: #262628; border: 1px solid #3a3a3d; border-radius: 10px; overflow: hidden; }
    .node h4 { margin: 0; padding: 8px 12px; font: 600 12px "Segoe UI", sans-serif; color: #cfcfcf; background: #2e2e31; }
    .node textarea { display: block; box-sizing: border-box; width: calc(100% - 20px); height: 120px; margin: 10px; padding: 8px; resize: none;
      background: #1b1b1d; color: #e6e6e6; border: 1px solid #3a3a3d; border-radius: 6px; font: 13px/1.5 Consolas, monospace; outline: none; }
  </style>
</head>
<body>
<script type="module">
import { attachSystemMonitor } from '../web/js/ui/systemMonitor.js';
import { initTagAutocomplete } from '../web/js/ui/tagAutocomplete.js';

document.documentElement.classList.add('cfy-still');
const view = new URLSearchParams(location.hash.slice(1)).get('view') || 'topbar';

if (view === 'topbar') {
  // Same markup as the launcher in civitaiDownloader.js.
  document.body.innerHTML = `<div class="bar"><div class="group"><button class="cfy-launch"><svg aria-hidden="true" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg>Civicomfy</button></div><span class="queue">▷ Queue</span></div>`;
  attachSystemMonitor(document.querySelector('.bar .group'));
} else if (view === 'autocomplete') {
  document.body.innerHTML = `<div class="node"><h4>CLIP Text Encode (Prompt)</h4><textarea class="comfy-multiline-input">masterpiece, 1girl, solo, long hair, </textarea></div>`;
  initTagAutocomplete();
  const ta = document.querySelector('textarea');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  document.execCommand('insertText', false, 'blu');
}
</script>
</body>
</html>
